<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131a2b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="419" rx="14" fill="none" stroke="#243049" stroke-width="1"/>

  <rect width="900" height="44" rx="14" fill="#151d33"/>
  <rect y="30" width="900" height="14" fill="#151d33"/>

  <circle cx="28" cy="22" r="6.5" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6.5" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6.5" fill="#27c93f"/>
  <text x="450" y="27" fill="#64748b" font-size="13" text-anchor="middle">avis.js — zsh</text>

  <text x="32" y="90" font-size="15">
    <tspan fill="#f472b6">const</tspan>
    <tspan fill="#e2e8f0"> developer </tspan>
    <tspan fill="#f472b6">=</tspan>
    <tspan fill="#e2e8f0"> {</tspan>
  </text>

  <text x="56" y="120" font-size="15">
    <tspan fill="#38bdf8">name</tspan>
    <tspan fill="#e2e8f0">: </tspan>
    <tspan fill="#34d399">"Avis Zola"</tspan>
    <tspan fill="#e2e8f0">,</tspan>
  </text>

  <text x="56" y="150" font-size="15">
    <tspan fill="#38bdf8">role</tspan>
    <tspan fill="#e2e8f0">: </tspan>
    <tspan fill="#34d399">"Frontend &amp; Mobile App Developer"</tspan>
    <tspan fill="#e2e8f0">,</tspan>
  </text>

  <text x="56" y="180" font-size="15">
    <tspan fill="#38bdf8">stack</tspan>
    <tspan fill="#e2e8f0">: [</tspan>
    <tspan fill="#34d399">"React"</tspan>
    <tspan fill="#e2e8f0">, </tspan>
    <tspan fill="#34d399">"React Native"</tspan>
    <tspan fill="#e2e8f0">, </tspan>
    <tspan fill="#34d399">"TypeScript"</tspan>
    <tspan fill="#e2e8f0">],</tspan>
  </text>

  <text x="56" y="210" font-size="15">
    <tspan fill="#38bdf8">focus</tspan>
    <tspan fill="#e2e8f0">: </tspan>
    <tspan fill="#34d399">"Clean UI, smooth UX, apps that just work"</tspan>
    <tspan fill="#e2e8f0">,</tspan>
  </text>

  <text x="56" y="240" font-size="15">
    <tspan fill="#38bdf8">openTo</tspan>
    <tspan fill="#e2e8f0">: </tspan>
    <tspan fill="#34d399">"internship, collab, freelance"</tspan>
  </text>

  <text x="32" y="270" font-size="15">
    <tspan fill="#e2e8f0">};</tspan>
  </text>

  <text x="32" y="310" font-size="15">
    <tspan fill="#64748b">// run</tspan>
  </text>
  <text x="32" y="335" font-size="15">
    <tspan fill="#f472b6">console</tspan>
    <tspan fill="#e2e8f0">.</tspan>
    <tspan fill="#38bdf8">log</tspan>
    <tspan fill="#e2e8f0">(</tspan>
    <tspan fill="#f472b6">`Hi, I'm ${developer.name} 👋`</tspan>
    <tspan fill="#e2e8f0">);</tspan>
  </text>

  <text x="32" y="365" font-size="15" fill="#64748b">&gt; Hi, I'm Avis Zola 👋</text>

  <rect x="330" y="352" width="9" height="16" fill="#34d399">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
